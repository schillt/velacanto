name: Velacanto Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [alpha, main]

permissions:
  contents: read

concurrency:
  group: pull-request-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Install preflight dependency
        run: brew install ripgrep

      - name: Verify OS 27 toolchain and select existing simulator
        run: |
          ./scripts/preflight.sh
          xcrun simctl list devices available --json > "$RUNNER_TEMP/velacanto-simulators.json"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          devices = json.loads((Path(os.environ["RUNNER_TEMP"]) / "velacanto-simulators.json").read_text())
          matches = [device for device in devices["devices"].get("com.apple.CoreSimulator.SimRuntime.iOS-27-0", [])
                     if device["name"] == "iPhone Air" and device["isAvailable"]]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one available iPhone Air with iOS 27.0; no simulator will be created.")
          destination = "platform=iOS Simulator,id=" + matches[0]["udid"]
          print("Verified destination: " + destination)
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write("VELACANTO_IOS_SIMULATOR_DESTINATION=" + destination + "\n")
          PYTHON

      - name: Run quality checks
        run: ./scripts/build.sh pr
