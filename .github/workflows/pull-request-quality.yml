name: Pull Request Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pull-request-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      VELACANTO_IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone Air,OS=26.5

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Show toolchain and simulator destination
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Run quality checks
        run: ./scripts/build.sh pr
