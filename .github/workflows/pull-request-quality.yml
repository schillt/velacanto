name: Pull Request Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [alpha, preview]

permissions:
  contents: read

concurrency:
  group: pull-request-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      VELACANTO_IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone Air,OS=26.5

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Install preflight dependency
        run: brew install ripgrep

      - name: Show toolchain and simulator destination
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Run quality checks
        # GitHub-hosted runners cannot compile OS 27 SDK APIs or launch OS 27
        # tests yet. The full `pr` gate remains required on an OS 27 machine.
        run: ./scripts/build.sh pr-hosted
