name: Pull Request Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [alpha, preview]

permissions:
  contents: read

concurrency:
  group: pull-request-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      VELACANTO_IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone Air,OS=27.0

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Install preflight dependency
        run: brew install ripgrep

      - name: Show OS 27 toolchain and simulator destination
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Run quality checks
        run: ./scripts/build.sh pr-os27-preview

  os27-preview:
    name: Xcode 26 Compatibility Advisory
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      VELACANTO_IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone Air,OS=26.5

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Install preflight dependency
        run: brew install ripgrep

      - name: Show compatibility toolchain and simulator destination
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Run Xcode 26 compatibility verification
        # The product requires OS 27. Keep this older toolchain visible as
        # advisory compatibility evidence without allowing it to override the
        # required native OS 27 build and test gate above.
        run: ./scripts/build.sh pr-hosted
