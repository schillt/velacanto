name: Pull Request Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pull-request-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VELACANTO_IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=18.5

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show toolchain and simulator destination
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Run quality checks
        run: ./scripts/build.sh pr
