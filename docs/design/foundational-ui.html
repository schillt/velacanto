:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget > :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type="file"] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type="file"]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type="file"]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type="color"] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed="true"],
    [aria-selected="true"],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html>body{padding:0}</style>
</head>
<body>
<div id="velacanto-liquid-glass-hybrid">
  <style>

  <div class="viz-controls prototype-controls" aria-label="Prototype controls">
    <label class="form-label" for="velacanto-hybrid-device">
      Device
      <select class="form-select" id="velacanto-hybrid-device">
        <option value="iphone">iPhone</option>
        <option value="mac">macOS</option>
      </select>
    </label>
    <label class="form-label" for="velacanto-hybrid-playback">
      Playback
      <select class="form-select" id="velacanto-hybrid-playback">
        <option value="playing">Playing</option>
        <option value="empty">Nothing playing</option>
      </select>
    </label>
  </div>

  <div class="stage">
    <section class="card device" id="velacanto-hybrid-shell" aria-label="Interactive Velacanto interface">
      <div id="velacanto-hybrid-app"></div>
    </section>
  </div>

  <p class="sr-only sr-status" id="velacanto-hybrid-status" aria-live="polite"></p>

  <script>
    (() => {
      const root = document.getElementById("velacanto-liquid-glass-hybrid");
      const app = root.querySelector("#velacanto-hybrid-app");
      const shell = root.querySelector("#velacanto-hybrid-shell");
      const status = root.querySelector("#velacanto-hybrid-status");
      const deviceSelect = root.querySelector("#velacanto-hybrid-device");
      const playbackSelect = root.querySelector("#velacanto-hybrid-playback");

      const tabs = [
        { id: "home", label: "Home", icon: "house" },
        { id: "new", label: "New", icon: "plus" },
        { id: "radio", label: "Radio", icon: "radio-tower" },
        { id: "library", label: "Library", icon: "library" },
        { id: "search", label: "Search", icon: "search" }
      ];

      const albums = [
        { title: "Midnight Signals", artist: "The Helix", image: "assets/midnight-signals.jpg" },
        { title: "Soft Focus", artist: "Luma Vale", image: "assets/soft-focus.jpg" },
        { title: "Elysium", artist: "Mindship", image: "assets/elysium.jpg" }
      ];

      const state = {
        device: "iphone",
        playback: "playing",
        activeTab: "home",
        isPlaying: true,
        showProfile: false,
        showMacMenu: false,
        showMacSettings: false
      };

      const icon = (name) => `<i data-lucide="${name}" aria-hidden="true"></i>`;

      function titleForState() {
        if (state.showMacSettings) return "Settings";
        if (state.showProfile) return "Account";
        return tabs.find((tab) => tab.id === state.activeTab)?.label || "Home";
      }

      function appHeader() {
        const back = state.showProfile || state.showMacSettings;
        return `
          <header class="app-header">
            ${back ? `<button class="btn btn-ghost" type="button" data-action="back" aria-label="Back">${icon("chevron-left")}</button>` : ""}
            <h2 class="app-title">${titleForState()}</h2>
            <span class="header-spacer"></span>
            ${state.showMacSettings || state.device === "mac" ? "" : `
              <button class="btn btn-ghost avatar glass" type="button" data-action="profile" aria-label="Open account">TS</button>
            `}
          </header>
        `;
      }

      function hero() {
        return `
          <section class="section" aria-labelledby="continue-heading">
            <p class="text-small eyebrow" id="continue-heading">Continue listening</p>
            <div class="hero">
              <img class="hero-art" src="assets/drifting-horizons.jpg" alt="Teal oceanic artwork for Drifting Horizons" />
              <div class="hero-copy">
                <h3>Drifting Horizons</h3>
                <p class="text-muted">Aurora Reverie</p>
                <p class="text-small text-muted">Odyssey · Jellyfin</p>
                <div class="progress-row" aria-label="1 minute 42 seconds of 3 minutes 58 seconds">
                  <span class="text-small text-muted">1:42</span>
                  <span class="progress-track" aria-hidden="true"><span class="progress-fill"></span></span>
                  <span class="text-small text-muted">3:58</span>
                </div>
                <div class="hero-actions">
                  <button class="btn btn-primary" type="button" data-action="toggle-playback">
                    ${icon(state.isPlaying ? "pause" : "play")}
                    ${state.isPlaying ? "Pause" : "Play"}
                  </button>
                  <button class="btn" type="button" aria-label="More options">${icon("ellipsis")}</button>
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function recentlyPlayed() {
        return `
          <section class="section" aria-labelledby="recent-heading">
            <div class="section-heading">
              <h3 id="recent-heading">Recently Played</h3>
              <button class="btn btn-ghost" type="button">See All</button>
            </div>
            <div class="album-grid">
              ${albums.map((album) => `
                <button class="btn btn-ghost album-button" type="button" data-action="choose-track" data-title="${album.title}" data-artist="${album.artist}" data-image="${album.image}">
                  <img class="album-art" src="${album.image}" alt="" />
                  <span class="album-copy">
                    <span>${album.title}</span>
                    <span class="text-small text-muted">${album.artist}</span>
                  </span>
                </button>
              `).join("")}
            </div>
          </section>
        `;
      }

      function libraryRows() {
        return `
          <section class="section" aria-labelledby="library-heading">
            <div class="section-heading">
              <h3 id="library-heading">From Your Library</h3>
            </div>
            <div class="action-list">
              <button class="btn btn-ghost action-row" type="button" data-nav="library">
                <span class="row-icon">${icon("server")}</span>
                <span class="row-copy">
                  <span>Jellyfin</span>
                  <span class="text-small text-muted">Connected · Home server</span>
                </span>
                ${icon("chevron-right")}
              </button>
              <button class="btn btn-ghost action-row" type="button">
                <span class="row-icon">${icon("folder-open")}</span>
                <span class="row-copy">
                  <span>Local Files</span>
                  <span class="text-small text-muted">Play audio on this device</span>
                </span>
                ${icon("chevron-right")}
              </button>
              <button class="btn btn-ghost action-row" type="button" data-nav="library">
                <span class="row-icon">${icon("list-music")}</span>
                <span class="row-copy">
                  <span>Playlists</span>
                  <span class="text-small text-muted">52 collections</span>
                </span>
                ${icon("chevron-right")}
              </button>
            </div>
          </section>
        `;
      }

      function homeContent() {
        return `<main class="content" role="tabpanel" aria-label="Home">${hero()}${recentlyPlayed()}${libraryRows()}</main>`;
      }

      function libraryContent() {
        const rows = [
          ["disc-3", "Albums", "1,842 albums"],
          ["users-round", "Artists", "768 artists"],
          ["music-2", "Songs", "18,306 songs"],
          ["list-music", "Playlists", "52 playlists"]
        ];
        return `
          <main class="content" role="tabpanel" aria-label="Library">
            <section class="section">
              <div class="section-heading"><h3>Your Music</h3></div>
              <div class="action-list">
                ${rows.map(([rowIcon, title, detail]) => `
                  <button class="btn btn-ghost action-row" type="button">
                    <span class="row-icon">${icon(rowIcon)}</span>
                    <span class="row-copy">
                      <span>${title}</span>
                      <span class="text-small text-muted">${detail}</span>
                    </span>
                    ${icon("chevron-right")}
                  </button>
                `).join("")}
              </div>
            </section>
            ${libraryRows()}
          </main>
        `;
      }

      function searchContent() {
        return `
          <main class="content" role="tabpanel" aria-label="Search">
            <div class="search-area">
              <label class="form-label" for="velacanto-hybrid-search">
                Search your music
                <input class="form-control" id="velacanto-hybrid-search" type="search" placeholder="Artists, albums, and songs" />
              </label>
              <div class="empty-state">
                <span class="empty-icon">${icon("search")}</span>
                <h3>Find anything in your library</h3>
                <p class="text-muted">Search Jellyfin and local music together.</p>
              </div>
            </div>
          </main>
        `;
      }

      function placeholderContent(kind) {
        const isRadio = kind === "radio";
        return `
          <main class="content" role="tabpanel" aria-label="${isRadio ? "Radio" : "New"}">
            <div class="empty-state">
              <span class="empty-icon">${icon(isRadio ? "radio-tower" : "sparkles")}</span>
              <h3>${isRadio ? "Your stations, in one place" : "Fresh from your library"}</h3>
              <p class="text-muted">${isRadio ? "Radio mixes will appear here as support lands." : "Recently added Jellyfin music will appear here."}</p>
            </div>
          </main>
        `;
      }

      function profileContent() {
        const settingsAction = state.device === "mac"
          ? `<button class="btn" type="button" data-action="settings">${icon("settings")} Settings…</button>`
          : `<button class="btn" type="button">${icon("external-link")} Open System Settings</button>`;
        return `
          <main class="content profile-content" aria-label="Account">
            <div class="profile-hero">
              <span class="avatar glass">TS</span>
              <h3>Tyler</h3>
              <p class="text-muted">Connected to Jellyfin</p>
            </div>
            <table class="table">
              <tbody>
                <tr><th scope="row">Server</th><td class="text-end">Home Jellyfin</td></tr>
                <tr><th scope="row">Connection</th><td class="text-end">Secure</td></tr>
              </tbody>
            </table>
            <div class="viz-row">
              ${settingsAction}
              <button class="btn" type="button">Log Out</button>
            </div>
          </main>
        `;
      }

      function settingsContent() {
        return `
          <main class="content" aria-label="Velacanto settings">
            <div class="settings-grid">
              <div class="setting-row">
                <span class="setting-copy"><span>Appearance</span><span class="text-small text-muted">Follows the macOS system setting</span></span>
                <span class="viz-badge">System</span>
              </div>
              <div class="setting-row">
                <span class="setting-copy"><span>Connected server</span><span class="text-small text-muted">Account changes stay on Home</span></span>
                <span>Home Jellyfin</span>
              </div>
              <div class="setting-row">
                <span class="setting-copy"><span>Playback diagnostics</span><span class="text-small text-muted">Show developer playback details</span></span>
                <label class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" aria-label="Show playback diagnostics" />
                </label>
              </div>
            </div>
          </main>
        `;
      }

      function currentContent() {
        if (state.showMacSettings) return settingsContent();
        if (state.showProfile) return profileContent();
        if (state.activeTab === "library") return libraryContent();
        if (state.activeTab === "search") return searchContent();
        if (state.activeTab === "new") return placeholderContent("new");
        if (state.activeTab === "radio") return placeholderContent("radio");
        return homeContent();
      }

      function miniPlayer(extraClass = "") {
        if (state.playback === "empty") {
          return `
            <div class="mini-player glass ${extraClass}" aria-label="Nothing playing">
              <span class="row-icon">${icon("music")}</span>
              <span class="mini-copy">
                <span>Nothing Playing</span>
                <span class="text-small text-muted">Choose music from Library</span>
              </span>
              <button class="btn btn-ghost" type="button" disabled aria-label="Play">${icon("play")}</button>
              <button class="btn btn-ghost" type="button" disabled aria-label="Next">${icon("skip-forward")}</button>
            </div>
          `;
        }
        return `
          <div class="mini-player glass ${extraClass}" aria-label="Now playing">
            <img class="mini-art" src="${state.currentImage || "assets/drifting-horizons.jpg"}" alt="" />
            <span class="mini-copy">
              <span>${state.currentTitle || "Drifting Horizons"}</span>
              <span class="text-small text-muted">${state.currentArtist || "Aurora Reverie"}</span>
            </span>
            <button class="btn btn-ghost" type="button" data-action="toggle-playback" aria-label="${state.isPlaying ? "Pause" : "Play"}">
              ${icon(state.isPlaying ? "pause" : "play")}
            </button>
            <button class="btn btn-ghost" type="button" aria-label="Next">${icon("skip-forward")}</button>
          </div>
        `;
      }

      function mobileNavigation() {
        const mainTabs = tabs.filter((tab) => tab.id !== "search");
        return `
          <div class="playback-chrome">
            ${miniPlayer()}
            <div class="navigation-row">
              <nav class="tab-capsule glass" aria-label="Primary navigation">
                ${mainTabs.map((tab) => `
                  <button class="btn btn-ghost tab-button" type="button" data-nav="${tab.id}" aria-selected="${state.activeTab === tab.id && !state.showProfile}">
                    ${icon(tab.icon)}
                    <span class="text-small tab-label">${tab.label}</span>
                  </button>
                `).join("")}
              </nav>
              <button class="btn btn-ghost search-orb glass" type="button" data-nav="search" aria-label="Search" aria-selected="${state.activeTab === "search" && !state.showProfile}">
                ${icon("search")}
              </button>
            </div>
          </div>
        `;
      }

      function sidebar() {
        return `
          <aside class="sidebar">
            <nav aria-label="Primary navigation">
              ${tabs.map((tab) => `
                <button class="btn btn-ghost" type="button" data-nav="${tab.id}" aria-selected="${state.activeTab === tab.id && !state.showProfile && !state.showMacSettings}">
                  ${icon(tab.icon)}
                  <span>${tab.label}</span>
                </button>
              `).join("")}
            </nav>
            <div class="sidebar-source">
              <span class="text-small text-muted">Jellyfin</span>
              <span class="text-small">Connected to Home server</span>
            </div>
          </aside>
        `;
      }

      function macTitlebar() {
        return `
          <div class="mac-titlebar">
            <button class="btn btn-ghost" type="button" data-action="mac-menu">Velacanto</button>
            <span class="toolbar-spacer"></span>
            <button class="btn btn-ghost" type="button" data-nav="search" aria-label="Search">${icon("search")}</button>
            <button class="btn btn-ghost avatar glass" type="button" data-action="profile" aria-label="Open account">TS</button>
          </div>
          <div class="menu-popover glass ${state.showMacMenu ? "is-open" : ""}" role="menu" aria-label="Velacanto menu">
            <button class="btn btn-ghost" type="button" data-action="settings" role="menuitem">
              <span>Settings…</span>
              <span class="text-muted">⌘,</span>
            </button>
          </div>
        `;
      }

      function render() {
        state.device = deviceSelect.value;
        state.playback = playbackSelect.value;
        shell.classList.toggle("is-mac", state.device === "mac");

        if (state.device === "iphone") {
          state.showMacMenu = false;
          state.showMacSettings = false;
          app.innerHTML = `
            <div class="phone-status text-small" aria-label="Status bar">
              <span>9:41</span>
              <span class="status-icons">${icon("signal")} ${icon("wifi")} ${icon("battery-full")}</span>
            </div>
            <div class="app-column">
              ${appHeader()}
              ${currentContent()}
              ${mobileNavigation()}
            </div>
          `;
        } else {
          app.innerHTML = `
            <div class="mac-window">
              ${macTitlebar()}
              <div class="mac-layout">
                ${sidebar()}
                <div class="app-column">
                  ${appHeader()}
                  ${currentContent()}
                  ${miniPlayer("mac-player")}
                </div>
              </div>
            </div>
          `;
        }

        status.textContent = `${state.device === "iphone" ? "iPhone" : "macOS"} ${titleForState()} view`;
        if (window.lucide) {
          window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        }
      }

      root.addEventListener("click", (event) => {
        const control = event.target.closest("button");
        if (!control) return;

        const nav = control.dataset.nav;
        const action = control.dataset.action;

        if (nav) {
          state.activeTab = nav;
          state.showProfile = false;
          state.showMacSettings = false;
          state.showMacMenu = false;
        }

        if (action === "profile") {
          state.showProfile = true;
          state.showMacSettings = false;
          state.showMacMenu = false;
        } else if (action === "back") {
          state.showProfile = false;
          state.showMacSettings = false;
        } else if (action === "mac-menu") {
          state.showMacMenu = !state.showMacMenu;
        } else if (action === "settings") {
          state.showProfile = false;
          state.showMacMenu = false;
          state.showMacSettings = state.device === "mac";
        } else if (action === "toggle-playback") {
          state.isPlaying = !state.isPlaying;
        } else if (action === "choose-track") {
          state.currentTitle = control.dataset.title;
          state.currentArtist = control.dataset.artist;
          state.currentImage = control.dataset.image;
          state.isPlaying = true;
          state.playback = "playing";
          playbackSelect.value = "playing";
        }

        render();
      });

      deviceSelect.addEventListener("change", () => {
        state.showProfile = false;
        state.showMacMenu = false;
        state.showMacSettings = false;
        render();
      });

      playbackSelect.addEventListener("change", render);
      render();
    })();
  </script>
</div>

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
